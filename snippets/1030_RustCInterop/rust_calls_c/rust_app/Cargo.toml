[package]
name = "rust_app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_app"
test = false
bench = false

[dependencies]

[build-dependencies]
cc = "1"

# Same size-focused profile as c_calls_rust/rust_lib - see README.md.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
